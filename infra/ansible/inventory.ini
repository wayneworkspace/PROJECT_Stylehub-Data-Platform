# The Airflow VM of infra/terraform/vm.tf. SSH goes through IAP, so the VM
# opens no port; project_id and vm_zone come from configure_vm.sh (-e).
[airflow]
stylehub-airflow

[airflow:vars]
ansible_ssh_common_args='-o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --zone={{ vm_zone }} --project={{ project_id }}" -o StrictHostKeyChecking=accept-new'
