# Sets up the Airflow VM: Docker, the secrets from Secret Manager, and the
# Airflow image CI tested (pulled from Artifact Registry, never built here).
# Run: infra/scripts/configure_vm.sh   (needs project_id, region, vm_zone)
- name: Airflow VM
  hosts: airflow
  become: true
  vars:
    project_root: /opt/stylehub
    secret_id: stylehub-dotenv
    image_tag: main # moved to the newest tested commit by CD
    registry: "{{ region }}-docker.pkg.dev"
    airflow_image: "{{ registry }}/{{ project_id }}/stylehub/stylehub-airflow:{{ image_tag }}"
    compose: docker compose --env-file secrets/.env --profile airflow

  tasks:
    - name: Install packages Docker's repository needs
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian]
        update_cache: true

    - name: Create the APT keyrings folder
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker's APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/debian
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: true

    - name: Start Docker on every boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the project folders
      ansible.builtin.file:
        path: "{{ project_root }}/{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "0"
        mode: "{{ item.mode }}"
      loop:
        - { path: "", owner: root, mode: "0755" }
        - { path: secrets, owner: root, mode: "0700" }
        - { path: logs/airflow, owner: "50000", mode: "0755" } # the airflow user inside the image

    - name: Copy the compose file and runtime config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "{{ project_root }}/"
        mode: preserve
      loop: [docker-compose.yaml, config]

    - name: Write secrets/.env from Secret Manager
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        gcloud secrets versions access latest --secret={{ secret_id }} --project={{ project_id }} > {{ project_root }}/secrets/.env
      args:
        executable: /bin/bash
      no_log: true # the file holds passwords
      changed_when: false

    - name: Let Docker pull from Artifact Registry with the VM account
      ansible.builtin.command: gcloud auth configure-docker {{ registry }} --quiet
      changed_when: false

    - name: Pull the tested Airflow image
      ansible.builtin.command: "{{ compose }} pull"
      args:
        chdir: "{{ project_root }}"
      environment:
        AIRFLOW_IMAGE: "{{ airflow_image }}"
      changed_when: true

    - name: Start or update the Airflow stack
      ansible.builtin.command: "{{ compose }} up -d --no-build --remove-orphans"
      args:
        chdir: "{{ project_root }}"
      environment:
        AIRFLOW_IMAGE: "{{ airflow_image }}"
      changed_when: true

    - name: Remove old images so the disk does not fill up
      ansible.builtin.command: docker image prune -f
      changed_when: false
