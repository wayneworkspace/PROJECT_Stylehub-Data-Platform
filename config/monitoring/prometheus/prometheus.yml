# Scrapes the monitoring profile of docker-compose.yaml; targets are service names.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node # host CPU, memory, disk
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: airflow # StatsD metrics of scheduler and tasks
    static_configs:
      - targets: ["statsd-exporter:9102"]
  - job_name: airflow-db # Airflow metadata database
    static_configs:
      - targets: ["postgres-exporter:9187"]
