# Seen in the Prometheus Alerts page; Discord alerts still come from Airflow.
groups:
  - name: airflow-host
    rules:
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        annotations:
          summary: "Memory use above 90% for 10 minutes"
      - alert: AirflowDatabaseDown
        expr: pg_up == 0
        for: 2m
        annotations:
          summary: "Airflow metadata database does not answer"
      - alert: AirflowTaskFailed
        expr: increase(airflow_ti_failures[1h]) > 0
        for: 0m
        annotations:
          summary: "At least one Airflow task failed in the last hour"
