# Runs before each commit. Set up once: uvx pre-commit install
# Tests and SQL lint run in CI on every pull request.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^uv\.lock
      - id: trailing-whitespace
        exclude: ^uv\.lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks  # blocks committed keys and passwords
    rev: v8.30.1
    hooks:
      - id: gitleaks
