version: 2

# Marts in the Silver dataset: dimensions and facts. unique + not_null on the id is the grain check.
models:
  - name: dim_products
    description: One row per product (grain). Latest snapshot from Bronze.
    columns:
      - name: id
        description: Product id from the source. Primary key.
        data_tests: [unique, not_null]
      - name: cost
        description: The product's cost today. Silver keeps no cost history.
      - name: retail_price
        description: The product's list price today.


  - name: dim_users
    description: One row per customer (grain).
    columns:
      - name: id
        description: Customer id from the source. Primary key.
        data_tests: [unique, not_null]
      - name: email_hash
        description: SHA-256 of the trimmed, lower-case email. No salt, so pseudonymised, not anonymous.

  - name: fact_orders
    description: One row per order (grain). Latest version of each order_id.
    columns:
      - name: order_id
        description: Order id from the source. Primary key.
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              # An error, not a warning: revenue only EXCLUDES the statuses in
              # revenue_excluded_statuses, so a new status would count as revenue by default.
              arguments:
                values: [Processing, Shipped, Complete, Cancelled, Returned]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: id
              config:
                severity: warn
      - name: total_amount
        description: Sum of the item sale prices of the order. 0 for an order without items.
      - name: order_date
        description: The day the order was placed (UTC).

  - name: fact_order_items
    description: One row per order item (grain).
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Processing, Shipped, Complete, Cancelled, Returned]
              config:
                severity: warn
      - name: sale_price
        data_tests: [not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
              config:
                severity: warn
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: id
              config:
                severity: warn
      - name: cost
        description: The product's cost today, not on the sale day. NULL if the product is unknown.
      - name: order_date
        description: The day the ORDER was placed (UTC). Partition column of this table.


  - name: fact_shipments
    description: One row per shipped order (grain), built from the order dates.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: fact_events
    description: >
      One row per event (grain). About 108 million rows. The grain test (unique + not_null on
      event_id) is a singular test that looks only at the recent window
      (tests/fact_events_recent_grain.sql): older partitions do not change in a daily run, and a
      test of the whole table scans 15 GB every day.
    columns:
      - name: event_id
        description: Id of the event. Unique within the recent window (singular test).
      - name: event_type
        data_tests: [not_null]
      - name: event_time
        data_tests: [not_null]
