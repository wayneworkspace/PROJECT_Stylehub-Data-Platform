# Connection settings. No secrets here: everything comes from environment variables.
# The Python wrapper (python -m stylehub.transform.run_dbt) loads secrets/.env and sets them for you.
#
# Two targets, so that nobody writes into the real datasets by accident:
#   prod  stylehub_silver and stylehub_gold. The pipeline (run_dbt.py) always uses it.
#   dev   your own copy, in dbt_<DBT_DEV_USER>_stylehub_silver and ..._gold (see
#         macros/generate_schema_name.sql). It is the default for a plain `dbt build` by hand.
#         Set your name once, for example in PowerShell:  $env:DBT_DEV_USER = "quang"
# Both targets READ the real Bronze tables. Only what dbt writes is separate.
stylehub:
  target: dev
  outputs:
    dev: &bigquery
      type: bigquery
      # Application Default Credentials: the key file in GOOGLE_APPLICATION_CREDENTIALS, your
      # gcloud login, the VM's service account, or Workload Identity in CI. One setting for all.
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "dbt_{{ env_var('DBT_DEV_USER', 'dev') | lower | replace('-', '_') | replace('.', '_') }}"
      location: "{{ env_var('GCP_LOCATION', 'asia-southeast1') }}"
      threads: 4
      # dbt retries a BigQuery job that fails for a short time (busy service, network).
      job_retries: 3
      # BigQuery refuses a query that would bill more bytes than this (default 50 GB).
      maximum_bytes_billed: "{{ env_var('BQ_MAX_BYTES_BILLED', '50000000000') | as_number }}"
    prod:
      <<: *bigquery
      dataset: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
