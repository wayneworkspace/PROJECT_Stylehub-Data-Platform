# Connection settings. No secrets here: everything comes from environment variables.
# The Python wrapper (python -m transform.run_dbt) loads secrets/.env and sets them for you.
stylehub:
  target: default
  outputs:
    default:
      type: bigquery
      # A key file when GOOGLE_APPLICATION_CREDENTIALS is set, otherwise your gcloud login.
      method: "{{ 'service-account' if env_var('GOOGLE_APPLICATION_CREDENTIALS', '') else 'oauth' }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
      location: "{{ env_var('GCP_LOCATION', 'asia-southeast1') }}"
      threads: 4
      # dbt retries a BigQuery job that fails for a short time (busy service, network).
      job_retries: 3
