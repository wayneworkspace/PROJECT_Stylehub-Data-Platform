# dbt builds the Silver and Gold layers. Bronze is loaded by Python, so dbt only reads it.
name: stylehub
version: "1.0.0"
config-version: 2
profile: stylehub

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # How many days back fact_events is rebuilt each run (late events inside this window are kept).
  events_lookback_days: 3
  # Order statuses that are NOT revenue (used by the macro revenue_order_filter).
  # Returned orders still count today. To report revenue after returns, add 'Returned' here.
  revenue_excluded_statuses: ['Cancelled']

models:
  stylehub:
    # Folders follow dbt Labs (staging -> intermediate -> marts). The datasets and the tags keep the
    # medallion names: the silver step builds staging, intermediate and marts/core, the gold step
    # builds marts/reporting.
    # Staging has its OWN dataset: it still holds the email and the exact location of a customer
    # (dim_users hides them). Give analysts access to silver and gold, not to staging.
    staging:
      +materialized: view
      +schema: "{{ env_var('BQ_STAGING', 'stylehub_staging') }}"
      +tags: ["silver"]
    intermediate:
      +materialized: view
      +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
      +tags: ["silver"]
    marts:
      core:
        +materialized: table
        +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
        +tags: ["silver"]
      reporting:
        +materialized: table
        +schema: "{{ env_var('BQ_GOLD', 'stylehub_gold') }}"
        +tags: ["gold"]
