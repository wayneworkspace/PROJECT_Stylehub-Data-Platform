# Local development. Starts a small Postgres with sample data, so you can test ingestion
# without touching the course database.
#
#   docker compose up -d postgres                      # start Postgres with sample data
#   docker compose run --rm pipeline python -m ingestion.incremental --table orders --date 2026-10-01 --dry-run
#   docker compose down -v                             # stop and delete the sample data
#
# The password below is for this throwaway local database only. Never reuse it anywhere else.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stylehub
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-stylehub_local}
      POSTGRES_DB: stylehub
    ports:
      # Bind to localhost only, so other machines on your network cannot reach it.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylehub -d stylehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    profiles: ["pipeline"]
    env_file:
      - path: .env
        required: false
    environment:
      # Point ingestion at the local Postgres, whatever .env says.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: stylehub
      PG_USER: stylehub
      PG_PASSWORD: ${LOCAL_PG_PASSWORD:-stylehub_local}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-sa.json
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
