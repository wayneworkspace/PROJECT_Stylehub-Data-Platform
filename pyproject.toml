[project]
name = "stylehub-data-platform"
version = "0.1.0"
description = "Data platform on GCP for the StyleHub dataset, built following a 5-session curriculum"
requires-python = ">=3.13,<3.14"  # same Python in CI, Docker and on laptops
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "google-cloud-storage>=2.18",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "colorlog>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
    "sqlfluff>=3",
    "typesafe-sdk[zstd]>=0.7.5",
]
# dbt for Silver and Gold; Airflow lives only in its image.
dbt = ["dbt-bigquery>=1.10"]
# The monitoring dashboard (src/5_serving).
serving = ["streamlit>=1.40", "db-dtypes>=1.2"]

[tool.uv]
# Not an installed package; run modules from the project folder.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "dags"]
# Needs Airflow; tests/test_dag_integrity.py checks it inside the Airflow image.
omit = ["dags/main_etl_dag.py"]

[tool.coverage.report]
fail_under = 100
include_namespace_packages = true  # no __init__.py files in this repo
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["to_delete"]

[tool.ruff.lint]
# Style, imports, modern syntax, bugs, security, UTC dates and pathlib.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "DTZ", "PTH", "RUF", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses assert
