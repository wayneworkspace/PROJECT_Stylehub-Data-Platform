[project]
name = "stylehub-data-platform"
version = "0.1.0"
description = "Data platform on GCP for the StyleHub dataset, built following a 5-session curriculum"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "google-cloud-storage>=2.18",
    "pandas>=2.2",
    "pyarrow>=16",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]
# Silver and Gold with dbt. Airflow is NOT here: install it on its own (see deploy/airflow/README.md).
dbt = ["dbt-bigquery>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Python packages live in src/python. This lets `python -m orchestration.run_daily` work from any folder.
packages = [
    "src/python/common",
    "src/python/ingestion",
    "src/python/storage",
    "src/python/transform",
    "src/python/orchestration",
]

[tool.ruff]
line-length = 100
extend-exclude = ["to_delete"]
# Tell ruff where the first-party packages live, so import sorting works.
src = ["src/python", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src/python", "src"]
# Integration tests need a real Postgres. Run them on purpose with: pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: needs a running Postgres (see docker-compose.yaml)"]
