# Local Docker setup; nothing starts unless you pick a profile.
#   airflow     docker compose --env-file secrets/.env --profile airflow up -d --build     (localhost:8080)
#   serving     docker compose --env-file secrets/.env --profile serving up -d --build     (localhost:8501)
#   monitoring  add --profile monitoring to airflow: Prometheus :9090, Grafana :3000
#   jenkins     docker compose --profile jenkins up -d                                      (localhost:8090)
# Images contain the code, so rebuild with --build after changes. To run the image
# CI tested instead, set AIRFLOW_IMAGE or DASHBOARD_IMAGE to its registry tag and
# use `pull` and `up -d --no-build` (the Airflow VM does this, see infra/ansible).
# AIRFLOW_ values in secrets/.env are for a throwaway local container.

x-airflow-common: &airflow-common
  profiles: ["airflow"]
  image: ${AIRFLOW_IMAGE:-stylehub-airflow:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db/airflow
    # One shared secret, or tasks cannot sign in to the API.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # One admin user; the API server writes its password file.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}  # encrypts stored connections and variables
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    STYLEHUB_HOME: /opt/stylehub  # see dags/utils_dag.py
    AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: config.airflow_local_settings.LOGGING_CONFIG
    PYTHONPATH: /opt/airflow  # makes config.airflow_local_settings importable
    DBT_USE_COLORS: "false"  # task logs are files, so no color codes
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}  # Discord alerts; empty means log only
    # Airflow metrics over StatsD; read by statsd-exporter in the monitoring profile.
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
  volumes:
    # Secrets, logging config and logs; drop secrets on a VM.
    - ./secrets:/opt/stylehub/secrets:ro
    - ./config:/opt/airflow/config:ro
    - ./logs/airflow:/opt/airflow/logs
    - ./logs:/opt/stylehub/logs  # custom_scripts and dbt logs
  depends_on: &after-db
    airflow-db:
      condition: service_healthy

services:
  dashboard:
    profiles: ["serving"]
    image: ${DASHBOARD_IMAGE:-stylehub-dashboard:local}
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:8501:8501"  # localhost only: the dashboard has no login
    env_file:
      - path: secrets/.env
        required: false
    volumes:
      - ./secrets:/app/secrets:ro

  airflow-db:
    profiles: ["airflow"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: checks the secrets, then creates the Airflow tables.
  airflow-init:
    <<: *airflow-common
    restart: "no"  # one run, then it exits
    entrypoint: /bin/bash
    command:
      - -c
      - >
        : "$${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in secrets/.env}" &&
        : "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in secrets/.env}" &&
        : "$${AIRFLOW__API__SECRET_KEY:?set AIRFLOW_SECRET_KEY in secrets/.env}" &&
        : "$${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW_FERNET_KEY in secrets/.env}" &&
        airflow db migrate

  # Web page and task API; replaces the Airflow 2 webserver.
  airflow-apiserver:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        python -c "import json, os; json.dump({os.environ['AIRFLOW_ADMIN_USER']:
        os.environ['AIRFLOW_ADMIN_PASSWORD']}, open('/opt/airflow/simple_auth_manager_passwords.json', 'w'))" &&
        exec airflow api-server
    depends_on: &after-init
      <<: *after-db
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8080}:8080"  # localhost only; change the port if taken
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: *after-init
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 60s
      timeout: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *after-init
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 60s
      timeout: 30s
      retries: 5

  # Monitoring of the Airflow host: run together with the airflow profile.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./config/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  node-exporter:  # CPU, memory and disk of the host
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  statsd-exporter:  # Airflow StatsD metrics to Prometheus
    profiles: ["monitoring"]
    image: prom/statsd-exporter:v0.28.0
    restart: unless-stopped

  postgres-exporter:  # the Airflow metadata database
    profiles: ["monitoring"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db:5432/airflow?sslmode=disable

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      # Empty: Grafana starts with admin/admin and asks for a new password at first login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  # CI on your own machine with the repository's Jenkinsfile (Poll SCM, no webhook).
  jenkins:
    profiles: ["jenkins"]
    image: jenkins/jenkins:2.516.1-lts-jdk21
    restart: unless-stopped
    volumes:
      - jenkins-home:/var/jenkins_home
    ports:
      - "127.0.0.1:8090:8080"  # localhost only

volumes:
  airflow-db-data:
  prometheus-data:
  grafana-data:
  jenkins-home:
