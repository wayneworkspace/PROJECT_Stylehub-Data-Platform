# Local Docker setup; nothing starts unless you pick a profile.
#   airflow  docker compose --env-file secrets/.env --profile airflow up -d --build  (localhost:8080)
#   serving  docker compose --env-file secrets/.env --profile serving up -d --build  (localhost:8501)
# Images contain the code, so rebuild with --build after changes.
# AIRFLOW_ values in secrets/.env are for a throwaway local container.

x-airflow-common: &airflow-common
  profiles: ["airflow"]
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db/airflow
    # One shared secret, or tasks cannot sign in to the API.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # One admin user; the API server writes its password file.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}  # encrypts stored connections and variables
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    STYLEHUB_HOME: /opt/stylehub  # see dags/utils_dag.py
    AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: config.airflow_local_settings.LOGGING_CONFIG
    PYTHONPATH: /opt/airflow  # makes config.airflow_local_settings importable
    DBT_USE_COLORS: "false"  # task logs are files, so no color codes
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}  # Discord alerts; empty means log only
    # Products API: an Airflow Connection and Variable defined by environment variables.
    AIRFLOW_CONN_STYLEHUB_API: '{"conn_type": "http", "host": "dummyjson.com", "schema": "https"}'
    AIRFLOW_VAR_STYLEHUB_API_PAGE_SIZE: "50"
  volumes:
    # Secrets, logging config and logs; drop secrets on a VM.
    - ./secrets:/opt/stylehub/secrets:ro
    - ./config:/opt/airflow/config:ro
    - ./logs/airflow:/opt/airflow/logs
    - ./logs:/opt/stylehub/logs  # custom_scripts and dbt logs
  depends_on: &after-db
    airflow-db:
      condition: service_healthy

services:
  dashboard:
    profiles: ["serving"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "127.0.0.1:8501:8501"  # localhost only: the dashboard has no login
    env_file:
      - path: secrets/.env
        required: false
    volumes:
      - ./secrets:/app/secrets:ro

  airflow-db:
    profiles: ["airflow"]
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: checks the secrets, then creates the Airflow tables.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        : "$${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in secrets/.env}" &&
        : "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in secrets/.env}" &&
        : "$${AIRFLOW__API__SECRET_KEY:?set AIRFLOW_SECRET_KEY in secrets/.env}" &&
        : "$${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW_FERNET_KEY in secrets/.env}" &&
        airflow db migrate &&
        airflow pools set api_pool 2 "Products API: at most 2 requests at once"

  # Web page and task API; replaces the Airflow 2 webserver.
  airflow-apiserver:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        python -c "import json, os; json.dump({os.environ['AIRFLOW_ADMIN_USER']:
        os.environ['AIRFLOW_ADMIN_PASSWORD']}, open('/opt/airflow/simple_auth_manager_passwords.json', 'w'))" &&
        exec airflow api-server
    depends_on: &after-init
      <<: *after-db
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8080}:8080"  # localhost only; change the port if taken
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: *after-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *after-init
      airflow-apiserver:
        condition: service_healthy

volumes:
  airflow-db-data:
