# dbt builds Silver and Gold; it only reads Bronze.
name: stylehub
version: "1.0.0"
config-version: 2
profile: stylehub

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Colored text on screen, JSON in files; --log-path points to logs/dbt.
flags:
  use_colors: true
  log_format: default
  log_format_file: json

vars:
  # Days of fact_events rebuilt each run, catching late events.
  events_lookback_days: 3
  # Order statuses that are not revenue (revenue_order_filter macro).
  revenue_excluded_statuses: ['Cancelled']
  # Published months to restate as a new version, e.g. ['2026-09-01'], and why
  # (pg_published_monthly_revenue). Pass with --vars; leave empty in daily runs.
  restate_months: []
  restate_note: 'Restated'

seeds:
  stylehub:
    # Small lookup tables; built by the pg_silver step.
    +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
    +tags: ["pg_silver"]

models:
  stylehub:
    # Tags pick the DAG step; they add up, so they sit on leaf folders.
    # Staging has its own dataset because it still holds personal data.
    staging:
      +materialized: view
      +schema: "{{ env_var('BQ_STAGING', 'stylehub_staging') }}"
      stylehub:
        +tags: ["silver"]
      stylehub_pg:
        +tags: ["pg_silver"]
      stylehub_api:
        +tags: ["api_silver"]
        # Built only where the API is set up; CD and dev runs skip it otherwise.
        +enabled: "{{ env_var('STYLEHUB_API_URL', '') != '' }}"
    intermediate:
      +materialized: view
      +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
      +tags: ["silver"]
    marts:
      core:
        +materialized: table
        +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
        +tags: ["silver"]
      reporting:
        +materialized: table
        +schema: "{{ env_var('BQ_GOLD', 'stylehub_gold') }}"
        +tags: ["gold"]
      pg_core:
        +materialized: table
        +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
        +tags: ["pg_silver"]
      api_core:
        +materialized: table
        +schema: "{{ env_var('BQ_SILVER', 'stylehub_silver') }}"
        +tags: ["api_silver"]
        +enabled: "{{ env_var('STYLEHUB_API_URL', '') != '' }}"
      pg_reporting:
        +materialized: table
        +schema: "{{ env_var('BQ_GOLD', 'stylehub_gold') }}"
        +tags: ["pg_gold"]
