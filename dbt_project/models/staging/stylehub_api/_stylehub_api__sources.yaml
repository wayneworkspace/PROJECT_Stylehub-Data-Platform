version: 2

# Users changed each day in the StyleHub REST API (step api_ingest).
sources:
  - name: stylehub_api
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_BRONZE', 'stylehub_bronze') }}"
    config:
      enabled: "{{ env_var('STYLEHUB_API_KEY', '') != '' }}"
    tables:
      - name: api_users
        description: >
          One partition per load day with the users changed in the window; the same id
          shows up again each time it changes.
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 26, period: hour}
        columns:
          - name: id
            data_type: int
          - name: updated_at
            data_type: timestamp
