version: 2

# Silver marts for the Postgres branch; id tests check the grain.
# Rows deleted in Postgres stay with is_deleted = true and deleted_at (first day seen);
# Gold leaves out deleted facts, dimensions keep them so old facts still join.
models:
  - name: pg_dim_products
    description: One row per product (grain).
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: is_deleted
        data_tests: [not_null]

  - name: pg_dim_users
    description: One row per customer (grain). Email is an unsalted SHA-256 hash.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: country
        data_tests:
          - relationships:
              arguments:
                to: ref('country_regions')
                field: country
              config:
                severity: warn  # a new country needs a row in seeds/country_regions.csv

  - name: pg_fact_orders
    description: One row per order (grain).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              # Error, not warning: a new status would count as revenue.
              arguments:
                values: [Processing, Shipped, Complete, Cancelled, Returned]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('pg_dim_users')
                field: id
              config:
                severity: warn

  - name: pg_fact_order_items
    description: One row per order item (grain). amount = sale_price * quantity.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount = sale_price * quantity"
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: amount
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('pg_fact_orders')
                field: order_id
              config:
                severity: warn
      - name: total_cost
        description: quantity * the product's cost today. NULL if the product is unknown.
      - name: total_cost_at_sale
        description: quantity * the cost valid when the item was sold (pg_dim_products_history).
      - name: product_key
        description: The product version valid when the item was sold. NULL if the product is unknown.
        data_tests:
          - relationships:
              arguments:
                to: ref('pg_dim_products_history')
                field: product_key
              config:
                severity: warn

  - name: pg_dim_products_history
    description: >
      SCD Type 2 of products, one row per version (grain product_id, valid_from). A new
      version starts only when row_hash of the tracked columns (name, category, brand,
      department, sku, cost, retail_price) changes. product_key is the surrogate key.
      valid_to is 9999-12-31 for the current row; the first version starts at 1970-01-01, so
      sales before the history began use it. tests/pg_products_history_is_continuous.sql
      checks one current row and no gaps or overlaps.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, valid_from]
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]

  - name: pg_fact_orders_versions
    description: >
      One row per order status the pipeline loaded (grain order_id, valid_from), for as-of
      questions such as "what was September revenue on the day the report went out?".
      valid_from is the load time (_ingested_at); valid_to is 9999-12-31 for the current row.
      tests/pg_orders_versions_is_continuous.sql checks one current row and no gaps.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, valid_from]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: status
        data_tests: [not_null]

  - name: pg_fact_shipments
    description: One row per shipment (grain). delivery_hours is NULL until delivered.
    columns:
      - name: shipment_id
        data_tests: [unique, not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: order_id
        data_tests: [unique, not_null]
