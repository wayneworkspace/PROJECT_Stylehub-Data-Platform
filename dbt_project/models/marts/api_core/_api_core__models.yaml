version: 2

models:
  - name: api_products
    description: Product catalog from the products API, newest snapshot.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price
        data_tests: [not_null]
      - name: availability_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["In Stock", "Low Stock", "Out of Stock"]
