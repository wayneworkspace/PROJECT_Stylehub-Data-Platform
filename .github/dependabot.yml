# Dependabot opens a pull request when a pinned version has a newer one. CI then tests the change.
# GitHub Actions are pinned to commit ids, the Dockerfiles to Python 3.12 / Airflow 3.3 tags (add a
# @sha256 digest to freeze them, see the comment in deploy/pipeline/Dockerfile).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/pipeline
    schedule:
      interval: weekly
    # Stay on Python 3.12: the project, CI and Airflow use one Python version.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /deploy/airflow
    schedule:
      interval: weekly
    # Airflow 3 minor and major releases can change the DAG API. Move on purpose, not by an automatic pull request.
    ignore:
      - dependency-name: apache/airflow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns: ["*"]
