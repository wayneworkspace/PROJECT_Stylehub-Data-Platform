name: Pipeline freshness

# The "did not run" alert. Airflow cannot warn you when Airflow itself is down, so GitHub checks
# from outside: it reads pipeline_runs and sends a Discord message when the last good run is old.
# Setup (once): docs/ops/DEPLOY_VM.md, section "Did not run alert". The job is skipped until the
# repository variable WIF_MONITOR_SERVICE_ACCOUNT is set.
# GitHub turns off schedules after 60 days without repository activity. Re-enable it if that happens.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, four hours after the DAG starts (02:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the last good run
    if: vars.WIF_MONITOR_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # a short-lived Google token, no key file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_MONITOR_SERVICE_ACCOUNT }}
      - name: Install the packages
        run: uv sync --frozen
      - name: Check pipeline_runs
        run: uv run python -m stylehub.orchestration.check_freshness
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          BQ_OPS: ${{ vars.BQ_OPS || 'stylehub_ops' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
