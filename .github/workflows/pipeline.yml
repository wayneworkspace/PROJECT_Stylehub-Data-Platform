name: Pipeline

# The daily run on GitHub Actions: free for a public repository, no machine to
# keep on. Same steps and order as dags/main_etl_dag.py (tests/test_custom_code.py
# checks both lists). Airflow stays for local runs and demos.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC, like the Airflow DAG; GitHub may start a few minutes late
  workflow_dispatch:
    inputs:
      data_date:
        description: "First data day YYYY-MM-DD (backfill); empty is yesterday in UTC"
        required: false
        type: string
      to_date:
        description: "Last data day YYYY-MM-DD for a range (at most 14 days); empty is data_date"
        required: false
        type: string

permissions:
  contents: read
  id-token: write # sign in to Google Cloud as sa-pipeline

# One run at a time. GitHub keeps only one waiting run per group and cancels the
# one waiting before it, so backfill a range with to_date, never with many runs.
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.12.13"
  # Steps of each branch, as in dags/main_etl_dag.py. A branch that is off there
  # (PG_ENABLED, API_ENABLED) stays empty here; tests/test_stages.py checks both.
  CSV_STEPS: "ingest bronze silver gold"
  PG_STEPS: "pg_ingest pg_bronze pg_reconcile pg_silver pg_gold"
  API_STEPS: "api_ingest api_bronze api_silver"

jobs:
  run:
    name: Daily run
    if: vars.WIF_PIPELINE_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120 # a day takes about 5 minutes; a 14-day range fits
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_LOCATION: ${{ vars.GCP_REGION }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      STYLEHUB_API_KEY: ${{ secrets.STYLEHUB_API_KEY }}
      DBT_USE_COLORS: "false"
      RUN_ID: gha-${{ github.run_id }}
      INPUT_DATE: ${{ inputs.data_date }}
      INPUT_TO: ${{ inputs.to_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PIPELINE_SERVICE_ACCOUNT }}
      - name: Pick the data days
        run: |
          FIRST="$(date -u -d "${INPUT_DATE:-yesterday}" +%F)"  # also rejects a bad date
          LAST="$(date -u -d "${INPUT_TO:-$FIRST}" +%F)"
          DAYS=""
          day="$FIRST"
          while [[ ! "$day" > "$LAST" ]]; do
            DAYS="$DAYS $day"
            day="$(date -u -d "$day + 1 day" +%F)"
          done
          count=$(wc -w <<< "$DAYS")
          if (( count == 0 || count > 14 )); then
            echo "::error::Give 1 to 14 days; got $count from $FIRST to $LAST"
            exit 1
          fi
          echo "DAYS=$DAYS" >> "$GITHUB_ENV"
          echo "DATA_DATE=$LAST" >> "$GITHUB_ENV"  # freshness and the alert use the last day
          echo "Data days:$DAYS (run $RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the pipeline
        run: |
          uv sync --frozen --extra dbt
          uv run dbt deps --project-dir dbt_project --profiles-dir dbt_project --log-path logs/dbt
      - name: Every branch, day by day
        run: |
          for day in $DAYS; do
            for step in $CSV_STEPS $PG_STEPS $API_STEPS; do
              uv run python -m src.4_transform.run_daily "$day" "$step" "$RUN_ID"
            done
          done
      - name: Freshness of the Bronze tables
        run: uv run python -m src.5_serving.freshness "$DATA_DATE" "$RUN_ID"
      - name: Tell Discord the run failed
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg c ":x: **Pipeline** failed for $DATA_DATE ($RUN_ID): $URL" '{content: $c}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$ALERT_WEBHOOK_URL" > /dev/null
