name: CI

on:
  push:
    branches: [main]
  # Also check every pull request, so a branch is tested before it reaches main.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an older run when a new commit arrives on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One Python and one uv for every job, the same as the Docker image and Airflow.
# Third-party actions are pinned to a full commit id, not a tag: a tag can be moved to other code.
# The comment next to each id names the version.
env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.13"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run all pre-commit hooks (ruff lint and format, gitleaks, file checks)
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Types, tests, dbt, SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --frozen --extra dev --extra dbt
      - name: Type check
        run: uv run mypy
      - name: Check the dbt project (no BigQuery connection)
        run: uv run python -m stylehub.transform.run_dbt all --command parse
        env:
          GCP_PROJECT_ID: ci-dummy-project
          GCS_BUCKET: ci-dummy-bucket
      - name: SQL lint (BigQuery dialect, no connection)
        run: uv run sqlfluff lint dbt/models dbt/macros src/stylehub/sql

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    env:
      IMAGE: stylehub-pipeline:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the image
        run: docker build --pull --build-arg UV_VERSION="$UV_VERSION" -f deploy/pipeline/Dockerfile -t "$IMAGE" .
      - name: The image starts
        run: docker run --rm "$IMAGE" python -m stylehub.orchestration.run_daily --help
      - name: The image does not run as root
        run: test "$(docker run --rm "$IMAGE" id -u)" != "0"
      - name: The compose file is valid (all profiles)
        run: docker compose --profile pipeline --profile airflow --profile serving config --quiet
      - name: The Airflow image builds, and the DAG loads inside it
        run: |
          docker build --build-arg UV_VERSION="$UV_VERSION" -f deploy/airflow/Dockerfile \
            -t "stylehub-airflow:${{ github.sha }}" .
          docker run --rm --entrypoint python "stylehub-airflow:${{ github.sha }}" -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder='/opt/airflow/dags')
          assert not bag.import_errors, bag.import_errors
          assert 'stylehub_daily' in bag.dags
          print('DAG ok:', sorted(bag.dags['stylehub_daily'].task_ids))"
      # From here only on main. CD does NOT build again: it takes THIS image, the one that was
      # tested above, and pushes it. So what runs on the VM is exactly what CI checked.
      - name: Save the image for CD
        if: github.event_name == 'push'
        run: docker save "$IMAGE" | gzip > pipeline-image.tar.gz
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: github.event_name == 'push'
        with:
          name: pipeline-image
          path: pipeline-image.tar.gz
          retention-days: 1
          compression-level: 0 # already gzip
      # The Airflow image is the one that runs every day, so CD publishes it as well.
      - name: Save the Airflow image for CD
        if: github.event_name == 'push'
        run: docker save "stylehub-airflow:${{ github.sha }}" | gzip > airflow-image.tar.gz
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: github.event_name == 'push'
        with:
          name: airflow-image
          path: airflow-image.tar.gz
          retention-days: 1
          compression-level: 0 # already gzip
