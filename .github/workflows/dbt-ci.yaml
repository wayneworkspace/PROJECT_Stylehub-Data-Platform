name: dbt build (dev datasets)

# `dbt parse` in ci.yaml only checks that the project reads. This workflow RUNS the models and
# their tests on BigQuery, in separate dev datasets (dbt_ci_stylehub_silver and ..._gold). It reads
# the real Bronze tables and never writes to the real Silver and Gold.
# Setup (once): docs/ops/CD.md, section "dbt build in CI". The job is skipped until the repository
# variable WIF_CI_SERVICE_ACCOUNT is set. A pull request from a fork has no access to the cloud.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped job looks green. Say out loud that the SQL was NOT run on BigQuery.
  dbt-not-configured:
    name: dbt build skipped (not configured)
    if: vars.WIF_CI_SERVICE_ACCOUNT == ''
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "::warning title=dbt build did not run::The repository variable
          WIF_CI_SERVICE_ACCOUNT is not set, so no model or test ran on BigQuery.
          See docs/ops/CD.md, section dbt build in CI."
  dbt:
    name: dbt build on BigQuery (dev)
    if: >-
      vars.WIF_CI_SERVICE_ACCOUNT != '' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # a short-lived Google token, no key file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_CI_SERVICE_ACCOUNT }}
      - name: Install the packages
        run: uv sync --frozen --extra dbt
      - name: Build Silver and Gold in the dev datasets (models and tests)
        run: uv run python -m stylehub.transform.run_dbt all --target dev
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || 'asia-southeast1' }}
          BQ_BRONZE: ${{ vars.BQ_BRONZE || 'stylehub_bronze' }}
          DBT_DEV_USER: ci
