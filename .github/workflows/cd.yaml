name: CD

# Publish the Docker image after CI passed on main. The VM pulls the new image by itself
# (see docs/ops/CD.md). GitHub never connects to the VM, so no SSH key and no open firewall port.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish-image:
    name: Build and push the image
    # Run only when CI succeeded, not when it failed or was cancelled.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job ask Google for a short-lived token (no key file)
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/stylehub-pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Let Docker use that login
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build the image
        run: docker build -f deploy/pipeline/Dockerfile -t "$IMAGE:${{ github.event.workflow_run.head_sha }}" -t "$IMAGE:latest" .
      - name: Push the image
        run: docker push --all-tags "$IMAGE"
