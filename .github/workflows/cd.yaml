name: CD

# Publish the Docker image after CI passed on main. The VM pulls the new image by itself
# (see docs/ops/CD.md). GitHub never connects to the VM, so no SSH key and no open firewall port.
#
# CD does not build. It takes the image that CI built, scanned and tested (the artifact
# "pipeline-image" of the same CI run) and pushes that. Only one tag is pushed: the commit id.
# There is no "latest": a VM names the exact version it runs, and rolling back means naming an
# older commit id.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish-image:
    name: Push the tested image
    # Only a successful CI run of a push to main. The "push" check matters: a pull request from a
    # fork can come from a branch that is also named main, and it must never reach this job.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lets this job download the artifact of the CI run
      id-token: write # lets this job ask Google for a short-lived token (no key file)
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/stylehub-pipeline
      AIRFLOW_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/stylehub-airflow
    steps:
      - name: Download the image that CI tested
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pipeline-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the Airflow image that CI tested
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: airflow-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load them and check that they are the commit CI tested
        run: |
          docker load --input pipeline-image.tar.gz
          docker load --input airflow-image.tar.gz
          docker image inspect "stylehub-pipeline:$SHA" > /dev/null
          docker image inspect "stylehub-airflow:$SHA" > /dev/null
      - name: Log in to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Let Docker use that login
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Push the images
        run: |
          docker tag "stylehub-pipeline:$SHA" "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"
          docker tag "stylehub-airflow:$SHA" "$AIRFLOW_IMAGE:$SHA"
          docker push "$AIRFLOW_IMAGE:$SHA"
      - name: Say which image to use
        run: |
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SHA")"
          airflow_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$AIRFLOW_IMAGE:$SHA")"
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline tag: \`$IMAGE:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Put one of them in STYLEHUB_IMAGE on the VM (runs by hand)." >> "$GITHUB_STEP_SUMMARY"
          echo "Airflow tag: \`$AIRFLOW_IMAGE:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Airflow digest: \`$airflow_digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The Airflow image is the one that runs the DAG every day." >> "$GITHUB_STEP_SUMMARY"
